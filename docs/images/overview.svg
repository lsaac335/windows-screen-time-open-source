<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">屏幕时间 ScreenTime v0.5.3 主面板示意</title>
  <desc id="desc">ScreenTime v0.5.3 黑曜石深色界面示意图，展示今日活跃、亮屏、前台时长、活跃占比环形图、分时柱状图和应用排行。所有数据均为示例。</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0D14"/>
      <stop offset="100%" stop-color="#0E111B"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181E30"/>
      <stop offset="100%" stop-color="#131724"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C8AFF"/>
      <stop offset="100%" stop-color="#46C6E8"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C8AFF"/>
      <stop offset="100%" stop-color="#46C6E8"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C8AFF"/>
      <stop offset="50%" stop-color="#5A9BF6"/>
      <stop offset="100%" stop-color="#46C6E8"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02040A" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1200" height="680" rx="24" fill="#070910"/>

  <!-- Main Window Frame -->
  <g filter="url(#shadow)">
    <rect x="28" y="24" width="1144" height="632" rx="16" fill="url(#bgGrad)" stroke="#232A3E" stroke-width="1.2"/>
  </g>

  <g font-family="Segoe UI, Microsoft YaHei UI, -apple-system, sans-serif">
    <!-- Top Unified Header Bar (y: 24..76) -->
    <!-- Brand Icon & Title -->
    <rect x="48" y="39" width="24" height="24" rx="6.5" fill="url(#ringGrad)"/>
    <rect x="53.5" y="51" width="3" height="7" rx="1.4" fill="#FFFFFF"/>
    <rect x="58.5" y="45" width="3" height="13" rx="1.4" fill="#FFFFFF"/>
    <rect x="63.5" y="48.5" width="3" height="9.5" rx="1.4" fill="#FFFFFF"/>
    <text x="82" y="56" font-size="15" font-weight="600" fill="#F3F5F9">屏幕时间</text>

    <!-- Date Range Segmented Control -->
    <rect x="236" y="36" width="170" height="30" rx="9" fill="#131722" stroke="#202636"/>
    <rect x="239" y="39" width="52" height="24" rx="7" fill="#1D2340"/>
    <text x="265" y="55" font-size="12" font-weight="600" fill="#B8C2FF" text-anchor="middle">今天</text>
    <text x="319" y="55" font-size="12" fill="#8E97AA" text-anchor="middle">昨天</text>
    <text x="376" y="55" font-size="12" fill="#8E97AA" text-anchor="middle">近 7 天</text>

    <!-- Date Picker Controls -->
    <text x="424" y="56" font-size="16" fill="#8E97AA" text-anchor="middle">‹</text>
    <rect x="438" y="36" width="118" height="30" rx="9" fill="#0F121B" stroke="#202636"/>
    <text x="497" y="55" font-size="12" fill="#F3F5F9" text-anchor="middle">2026-11-28</text>
    <text x="570" y="56" font-size="16" fill="#667085" text-anchor="middle">›</text>
    <text x="596" y="55" font-size="13.5" fill="#8E97AA" text-anchor="middle">↻</text>

    <!-- Right: Status Pill & Window Caption Controls -->
    <rect x="920" y="38" width="90" height="26" rx="13" fill="#112923"/>
    <circle cx="935" cy="51" r="3.2" fill="#34D399"/>
    <text x="945" y="55" font-size="11.5" font-weight="500" fill="#34D399">正在记录</text>

    <!-- Pin / Min / Max / Close -->
    <g stroke="#8E97AA" stroke-width="1.3" fill="none" stroke-linecap="round">
      <circle cx="1040" cy="51" r="3.5"/>
      <line x1="1040" y1="54.5" x2="1040" y2="59"/>
      <line x1="1072" y1="51" x2="1082" y2="51"/>
      <rect x="1106" y="46.5" width="9" height="9" rx="1"/>
      <line x1="1140" y1="46.5" x2="1149" y2="55.5"/>
      <line x1="1149" y1="46.5" x2="1140" y2="55.5"/>
    </g>

    <!-- Left Sidebar Card (x: 48..220, y: 80..636) -->
    <rect x="48" y="80" width="174" height="556" rx="18" fill="#111520" stroke="#202636"/>
    <!-- Nav Items -->
    <rect x="58" y="94" width="154" height="38" rx="10" fill="#1D2340"/>
    <text x="76" y="118" font-size="13.5" font-weight="600" fill="#B8C2FF">使用概览</text>
    <text x="76" y="160" font-size="13.5" fill="#8E97AA">应用统计</text>
    <text x="76" y="202" font-size="13.5" fill="#8E97AA">设置</text>

    <!-- Sidebar Footer Actions -->
    <text x="74" y="516" font-size="12.5" fill="#8E97AA">桌面小组件</text>
    <text x="74" y="550" font-size="12.5" fill="#8E97AA">导出 CSV</text>
    <line x1="64" y1="569" x2="206" y2="569" stroke="#202636"/>
    <text x="70" y="594" font-size="12" font-weight="500" fill="#8E97AA">本地记录</text>
    <text x="70" y="614" font-size="11" fill="#667085">Visual Studio Code</text>

    <!-- Row 0: 3-Part Hero Card (x: 236..1152, y: 80..220) -->
    <rect x="236" y="80" width="916" height="140" rx="18" fill="url(#heroGrad)" stroke="#202636"/>

    <!-- Hero Left: Today Active -->
    <text x="262" y="114" font-size="13" font-weight="500" fill="#8E97AA">今日活跃</text>
    <rect x="326" y="99" width="76" height="21" rx="10.5" fill="#112923"/>
    <text x="364" y="113.5" font-size="11" font-weight="500" fill="#34D399" text-anchor="middle">+12% 较昨日</text>
    <text x="262" y="168" font-size="44" font-weight="600" fill="#B8C2FF">4<tspan font-size="22" font-weight="500">小时 </tspan>36<tspan font-size="22" font-weight="500">分</tspan></text>
    <text x="262" y="196" font-size="11.5" fill="#667085">按空闲规则估算 · 不含本软件</text>

    <!-- Vertical Divider -->
    <line x1="612" y1="100" x2="612" y2="200" stroke="#202636"/>

    <!-- Hero Middle: Screen-on & Foreground -->
    <text x="640" y="112" font-size="11.5" fill="#8E97AA">亮屏时长</text>
    <text x="640" y="139" font-size="22" font-weight="600" fill="#F3F5F9">6<tspan font-size="13" font-weight="400">小时 </tspan>42<tspan font-size="13" font-weight="400">分</tspan></text>
    <text x="748" y="138" font-size="11" fill="#667085">含锁屏 16 分</text>

    <text x="640" y="170" font-size="11.5" fill="#8E97AA">前台时长</text>
    <text x="640" y="197" font-size="22" font-weight="600" fill="#F3F5F9">5<tspan font-size="13" font-weight="400">小时 </tspan>48<tspan font-size="13" font-weight="400">分</tspan></text>
    <text x="748" y="196" font-size="11" fill="#667085">含空闲</text>

    <!-- Hero Right: Crisp Activity Ring (69%) -->
    <g transform="translate(1078, 150)">
      <circle r="40" fill="none" stroke="#232A3E" stroke-width="8"/>
      <!-- 69% of 2*pi*40 (251.3) = 173.4 -->
      <circle r="40" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round"
              stroke-dasharray="173.4 251.3" transform="rotate(-90)"/>
      <text x="0" y="7" font-size="20" font-weight="600" fill="#B8C2FF" text-anchor="middle">69%</text>
    </g>

    <!-- Row 1 Left: Hourly Usage Card (x: 236..740, y: 236..636) -->
    <rect x="236" y="236" width="504" height="400" rx="18" fill="#131722" stroke="#202636"/>
    <text x="260" y="270" font-size="15.5" font-weight="600" fill="#F3F5F9">分时使用</text>
    <text x="332" y="270" font-size="11.5" fill="#667085">亮屏 / 活跃</text>

    <!-- Metric Switcher Pill -->
    <rect x="540" y="249" width="134" height="27" rx="8" fill="#0B0D14" stroke="#202636"/>
    <rect x="543" y="252" width="42" height="21" rx="6" fill="#1D2340"/>
    <text x="564" y="266.5" font-size="11.5" font-weight="600" fill="#B8C2FF" text-anchor="middle">活跃</text>
    <text x="607" y="266.5" font-size="11.5" fill="#8E97AA" text-anchor="middle">前台</text>
    <text x="650" y="266.5" font-size="11.5" fill="#8E97AA" text-anchor="middle">可见</text>
    <text x="704" y="266.5" font-size="11.5" fill="#8E97AA" text-anchor="middle">明细 ›</text>

    <!-- Chart Grid & Axes -->
    <g stroke="#1B2130" stroke-width="1">
      <line x1="292" y1="322" x2="716" y2="322"/>
      <line x1="292" y1="392" x2="716" y2="392"/>
      <line x1="292" y1="462" x2="716" y2="462"/>
      <line x1="292" y1="532" x2="716" y2="532"/>
    </g>
    <g font-size="11" fill="#757F94" text-anchor="end">
      <text x="284" y="326">60分</text>
      <text x="284" y="396">40分</text>
      <text x="284" y="466">20分</text>
      <text x="284" y="536">0</text>
    </g>

    <!-- Missing/Unrecorded Hatch Region (12:00-13:00 sample) -->
    <rect x="504" y="322" width="18" height="210" fill="url(#hatch)"/>
    <!-- Future Subtle Shading (19:00-23:00) -->
    <rect x="630" y="322" width="86" height="210" fill="#FFFFFF" fill-opacity="0.02"/>

    <!-- Layered Bars: Screen-on Backdrop (#252E4A) + Active Gradient -->
    <!-- Hour 09..18 -->
    <g>
      <!-- 08 -->
      <rect x="378" y="480" width="13" height="52" rx="4" fill="#252E4A"/>
      <rect x="378" y="498" width="13" height="34" rx="4" fill="url(#barGrad)"/>
      <!-- 09 -->
      <rect x="398" y="376" width="13" height="156" rx="4" fill="#252E4A"/>
      <rect x="398" y="410" width="13" height="122" rx="4" fill="url(#barGrad)"/>
      <!-- 10 -->
      <rect x="418" y="344" width="13" height="188" rx="4" fill="#252E4A"/>
      <rect x="418" y="370" width="13" height="162" rx="4" fill="url(#barGrad)"/>
      <!-- 11 -->
      <rect x="438" y="356" width="13" height="176" rx="4" fill="#252E4A"/>
      <rect x="438" y="394" width="13" height="138" rx="4" fill="url(#barGrad)"/>
      <!-- 13 -->
      <rect x="478" y="432" width="13" height="100" rx="4" fill="#252E4A"/>
      <rect x="478" y="456" width="13" height="76" rx="4" fill="url(#barGrad)"/>
      <!-- 14 -->
      <rect x="530" y="362" width="13" height="170" rx="4" fill="#252E4A"/>
      <rect x="530" y="392" width="13" height="140" rx="4" fill="url(#barGrad)"/>
      <!-- 15 -->
      <rect x="550" y="338" width="13" height="194" rx="4" fill="#252E4A"/>
      <rect x="550" y="362" width="13" height="170" rx="4" fill="url(#barGrad)"/>
      <!-- 16 -->
      <rect x="570" y="372" width="13" height="160" rx="4" fill="#252E4A"/>
      <rect x="570" y="408" width="13" height="124" rx="4" fill="url(#barGrad)"/>
      <!-- 17 -->
      <rect x="590" y="404" width="13" height="128" rx="4" fill="#252E4A"/>
      <rect x="590" y="438" width="13" height="94" rx="4" fill="url(#barGrad)"/>
      <!-- 18 -->
      <rect x="610" y="446" width="13" height="86" rx="4" fill="#252E4A"/>
      <rect x="610" y="472" width="13" height="60" rx="4" fill="url(#barGrad)"/>
    </g>

    <!-- X Axis Labels -->
    <g font-size="11" fill="#757F94" text-anchor="middle">
      <text x="302" y="556">00</text>
      <text x="398" y="556">06</text>
      <text x="504" y="556">12</text>
      <text x="610" y="556">18</text>
      <text x="706" y="556">23</text>
    </g>
    <text x="260" y="610" font-size="11.5" fill="#667085">当日自 00:00 开始记录 · 仅汇总实际观测区间 · 斜纹表示未记录时段</text>

    <!-- Row 1 Right: Top Apps Card (x: 754..1152, y: 236..636) -->
    <rect x="754" y="236" width="398" height="400" rx="18" fill="#131722" stroke="#202636"/>
    <text x="778" y="270" font-size="15.5" font-weight="600" fill="#F3F5F9">应用排行</text>
    <text x="1126" y="269" font-size="12" fill="#7C8AFF" text-anchor="end">全部 ›</text>

    <!-- App Row 1: VS Code -->
    <g transform="translate(778, 298)">
      <rect width="32" height="32" rx="8" fill="#1D2B4A"/>
      <path d="M10 12 L21 21 M21 11 L10 20 M21 9 L21 23" stroke="#46C6E8" stroke-width="2.2" stroke-linecap="round"/>
      <text x="44" y="13" font-size="13" font-weight="500" fill="#F3F5F9">Visual Studio Code</text>
      <text x="350" y="13" font-size="12.5" font-weight="600" fill="#F3F5F9" text-anchor="end">1小时 52分</text>
      <rect x="44" y="24" width="306" height="5" rx="2.5" fill="#1E2538"/>
      <rect x="44" y="24" width="248" height="5" rx="2.5" fill="url(#accentGrad)"/>
    </g>

    <!-- App Row 2: Microsoft Edge -->
    <g transform="translate(778, 362)">
      <rect width="32" height="32" rx="8" fill="#163042"/>
      <circle cx="16" cy="16" r="7" fill="none" stroke="#34D399" stroke-width="2.4"/>
      <text x="44" y="13" font-size="13" font-weight="500" fill="#F3F5F9">Microsoft Edge</text>
      <text x="350" y="13" font-size="12.5" font-weight="600" fill="#F3F5F9" text-anchor="end">1小时 08分</text>
      <rect x="44" y="24" width="306" height="5" rx="2.5" fill="#1E2538"/>
      <rect x="44" y="24" width="164" height="5" rx="2.5" fill="url(#accentGrad)"/>
    </g>

    <!-- App Row 3: Figma -->
    <g transform="translate(778, 426)">
      <rect width="32" height="32" rx="8" fill="#2A2044"/>
      <circle cx="16" cy="12" r="3.2" fill="#A78BFA"/>
      <circle cx="16" cy="20" r="3.2" fill="#7C8AFF"/>
      <text x="44" y="13" font-size="13" font-weight="500" fill="#F3F5F9">Figma</text>
      <text x="350" y="13" font-size="12.5" font-weight="600" fill="#F3F5F9" text-anchor="end">44分 00秒</text>
      <rect x="44" y="24" width="306" height="5" rx="2.5" fill="#1E2538"/>
      <rect x="44" y="24" width="108" height="5" rx="2.5" fill="url(#accentGrad)"/>
    </g>

    <!-- App Row 4: 微信 -->
    <g transform="translate(778, 490)">
      <rect width="32" height="32" rx="8" fill="#143329"/>
      <circle cx="13.5" cy="15" r="4.5" fill="#34D399"/>
      <circle cx="19.5" cy="18.5" r="3.5" fill="#6EE7B7"/>
      <text x="44" y="13" font-size="13" font-weight="500" fill="#F3F5F9">微信</text>
      <text x="350" y="13" font-size="12.5" font-weight="600" fill="#F3F5F9" text-anchor="end">32分 00秒</text>
      <rect x="44" y="24" width="306" height="5" rx="2.5" fill="#1E2538"/>
      <rect x="44" y="24" width="76" height="5" rx="2.5" fill="url(#accentGrad)"/>
    </g>

    <!-- App Row 5: Windows Terminal -->
    <g transform="translate(778, 554)">
      <rect width="32" height="32" rx="8" fill="#1E2334"/>
      <text x="16" y="20" font-size="11.5" font-weight="700" fill="#B8C2FF" text-anchor="middle">&gt;_</text>
      <text x="44" y="13" font-size="13" font-weight="500" fill="#F3F5F9">Windows Terminal</text>
      <text x="350" y="13" font-size="12.5" font-weight="600" fill="#F3F5F9" text-anchor="end">20分 00秒</text>
      <rect x="44" y="24" width="306" height="5" rx="2.5" fill="#1E2538"/>
      <rect x="44" y="24" width="48" height="5" rx="2.5" fill="url(#accentGrad)"/>
    </g>
  </g>
</svg>
