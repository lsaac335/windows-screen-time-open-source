<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">屏幕时间 ScreenTime 界面示意</title><desc id="desc">应用概览示意图，显示亮屏时间、应用时间和每日分布。所有数据均为示例。</desc>
<rect width="1200" height="630" rx="26" fill="#0d1222"/><rect x="30" y="30" width="1140" height="570" rx="20" fill="#111827" stroke="#263149"/>
<rect x="30" y="30" width="190" height="570" rx="20" fill="#17243b"/><rect x="30" y="55" width="190" height="525" fill="#17243b"/>
<rect x="58" y="72" width="42" height="42" rx="13" fill="#6b5df0"/><rect x="68" y="91" width="5" height="12" rx="2" fill="#fff"/><rect x="77" y="82" width="5" height="21" rx="2" fill="#fff"/><rect x="86" y="88" width="5" height="15" rx="2" fill="#fff"/>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="58" y="151" font-size="22" font-weight="700" fill="#fff">屏幕时间</text><text x="58" y="177" font-size="12" letter-spacing="2" fill="#9da9be">SCREEN TIME</text>
<rect x="48" y="228" width="154" height="44" rx="10" fill="#30415f"/><text x="65" y="256" font-size="15" fill="#fff">▦  使用概览</text><text x="65" y="311" font-size="15" fill="#aab7ca">▥  应用统计</text><text x="65" y="366" font-size="15" fill="#aab7ca">⚙  设置</text>
<text x="255" y="92" font-size="29" font-weight="700" fill="#f7f8ff">使用概览</text><text x="255" y="121" font-size="14" fill="#9daac0">每一天，看看时间的流向。</text><text x="1042" y="91" font-size="13" fill="#aab7ca">功能示意图</text>
<rect x="255" y="155" width="265" height="118" rx="14" fill="#1d293d"/><rect x="536" y="155" width="265" height="118" rx="14" fill="#6255da"/><rect x="817" y="155" width="305" height="118" rx="14" fill="#1d293d"/>
<text x="277" y="187" font-size="14" fill="#b7c3d8">亮屏时长</text><text x="277" y="235" font-size="30" font-weight="700" fill="#fff">4 小时 20 分</text><text x="558" y="187" font-size="14" fill="#ddd9ff">前台使用时长</text><text x="558" y="235" font-size="30" font-weight="700" fill="#fff">3 小时 15 分</text><text x="839" y="187" font-size="14" fill="#b7c3d8">锁屏亮屏</text><text x="839" y="235" font-size="30" font-weight="700" fill="#fff">18 分钟</text>
<rect x="255" y="291" width="867" height="253" rx="14" fill="#1d293d"/><text x="277" y="324" font-size="16" font-weight="600" fill="#f0f3fc">一天中的使用分布</text><text x="277" y="350" font-size="12" fill="#9daac0">亮屏  ·  应用前台</text>
