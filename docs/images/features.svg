<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">ScreenTime 功能介绍</title><desc id="desc">示意图：应用对比柱状图、桌面小组件和本地数据保护。</desc>
<rect width="1200" height="480" rx="26" fill="#eef1fb"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif">
<rect x="30" y="30" width="360" height="420" rx="20" fill="#fff"/><rect x="420" y="30" width="360" height="420" rx="20" fill="#fff"/><rect x="810" y="30" width="360" height="420" rx="20" fill="#fff"/>
<text x="58" y="80" font-size="22" font-weight="700" fill="#17233a">应用统计</text><text x="58" y="109" font-size="14" fill="#72809a">按日期比较各应用的前台使用时间</text>
<g font-size="14" fill="#34435c"><text x="58" y="167">浏览器</text><text x="58" y="218">编辑器</text><text x="58" y="269">其他应用</text></g><g fill="#eeeefa"><rect x="150" y="149" width="200" height="20" rx="10"/><rect x="150" y="200" width="200" height="20" rx="10"/><rect x="150" y="251" width="200" height="20" rx="10"/></g><g fill="#7467ed"><rect x="150" y="149" width="180" height="20" rx="10"/><rect x="150" y="200" width="126" height="20" rx="10"/><rect x="150" y="251" width="78" height="20" rx="10"/></g><text x="58" y="398" font-size="13" fill="#8793a7">示例数据 · 支持搜索和详情</text>
<text x="448" y="80" font-size="22" font-weight="700" fill="#17233a">桌面小组件</text><text x="448" y="109" font-size="14" fill="#72809a">随时查看今日概况</text><rect x="460" y="139" width="280" height="222" rx="18" fill="#172339"/><text x="482" y="175" font-size="15" font-weight="700" fill="#fff">屏幕时间</text><text x="482" y="209" font-size="12" fill="#aebad0">今日亮屏</text><text x="621" y="209" font-size="12" fill="#aebad0">应用使用</text><text x="482" y="242" font-size="23" font-weight="700" fill="#fff">4时20分</text><text x="621" y="242" font-size="23" font-weight="700" fill="#aea3ff">3时15分</text><g fill="#9085ff"><rect x="490" y="291" width="18" height="29" rx="3"/><rect x="519" y="270" width="18" height="50" rx="3"/><rect x="548" y="281" width="18" height="39" rx="3"/><rect x="606" y="285" width="18" height="35" rx="3"/><rect x="635" y="264" width="18" height="56" rx="3"/></g><text x="448" y="398" font-size="13" fill="#8793a7">浮动卡片 · 位置与置顶可调</text>
<text x="838" y="80" font-size="22" font-weight="700" fill="#17233a">数据留在本机</text><text x="838" y="109" font-size="14" fill="#72809a">无需注册账号或上传记录</text><rect x="884" y="150" width="212" height="156" rx="20" fill="#f2f0ff"/><path d="M990 170l44 17v40c0 29-19 49-44 61-25-12-44-32-44-61v-40z" fill="#7467ed"/><path d="M971 228l13 13 26-30" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="838" y="353" font-size="14" fill="#34435c">不读取窗口标题、网址或按键内容</text><text x="838" y="398" font-size="13" fill="#8793a7">本地记录 · 可导出 CSV</text>
</g></svg>
