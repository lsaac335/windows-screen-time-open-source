<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">ScreenTime v0.5.3 核心功能示意</title>
  <desc id="desc">展示应用多口径统计、深浅双主题桌面小组件，以及本地隐私与后台静默记录。</desc>
  <defs>
    <linearGradient id="accentDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C8AFF"/>
      <stop offset="100%" stop-color="#46C6E8"/>
    </linearGradient>
    <linearGradient id="accentLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F5CE0"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="barDarkV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C8AFF"/>
      <stop offset="100%" stop-color="#46C6E8"/>
    </linearGradient>
    <linearGradient id="barLightV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F5CE0"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="heroDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181E30"/>
      <stop offset="100%" stop-color="#131724"/>
    </linearGradient>
    <linearGradient id="heroLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F7FF"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#02040A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="24" fill="#0B0D14"/>

  <g font-family="Segoe UI, Microsoft YaHei UI, -apple-system, sans-serif">
    <!-- PANEL 1: Multi-Metric App Statistics -->
    <rect x="28" y="28" width="364" height="444" rx="20" fill="#131722" stroke="#202636"/>
    <text x="54" y="68" font-size="19" font-weight="600" fill="#F3F5F9">多口径应用统计</text>
    <text x="54" y="92" font-size="12.5" fill="#8E97AA">活跃 · 前台 · 多窗口可见独立切换</text>

    <!-- Segmented Pill -->
    <rect x="54" y="114" width="168" height="28" rx="8" fill="#0B0D14" stroke="#202636"/>
    <rect x="57" y="117" width="52" height="22" rx="6" fill="#1D2340"/>
    <text x="83" y="132" font-size="11.5" font-weight="600" fill="#B8C2FF" text-anchor="middle">活跃</text>
    <text x="138" y="132" font-size="11.5" fill="#8E97AA" text-anchor="middle">前台</text>
    <text x="192" y="132" font-size="11.5" fill="#8E97AA" text-anchor="middle">可见</text>

    <!-- Search Input -->
    <rect x="234" y="114" width="132" height="28" rx="8" fill="#0F121B" stroke="#202636"/>
    <text x="246" y="132" font-size="11.5" fill="#667085">搜索应用...</text>

    <!-- Horizontal Bar Chart -->
    <g transform="translate(54, 168)">
      <text x="0" y="13" font-size="12.5" fill="#F3F5F9">VS Code</text>
      <text x="312" y="13" font-size="12" fill="#B8C2FF" text-anchor="end">1时52分 · 41%</text>
      <rect x="0" y="22" width="312" height="9" rx="4.5" fill="#1B2130"/>
      <rect x="0" y="22" width="268" height="9" rx="4.5" fill="url(#accentDark)"/>

      <text x="0" y="64" font-size="12.5" fill="#F3F5F9">Microsoft Edge</text>
      <text x="312" y="64" font-size="12" fill="#B8C2FF" text-anchor="end">1时08分 · 25%</text>
      <rect x="0" y="73" width="312" height="9" rx="4.5" fill="#1B2130"/>
      <rect x="0" y="73" width="182" height="9" rx="4.5" fill="url(#accentDark)"/>

      <text x="0" y="115" font-size="12.5" fill="#F3F5F9">Figma</text>
      <text x="312" y="115" font-size="12" fill="#B8C2FF" text-anchor="end">44分 · 16%</text>
      <rect x="0" y="124" width="312" height="9" rx="4.5" fill="#1B2130"/>
      <rect x="0" y="124" width="122" height="9" rx="4.5" fill="url(#accentDark)"/>

      <text x="0" y="166" font-size="12.5" fill="#F3F5F9">微信</text>
      <text x="312" y="166" font-size="12" fill="#B8C2FF" text-anchor="end">32分 · 11%</text>
      <rect x="0" y="175" width="312" height="9" rx="4.5" fill="#1B2130"/>
      <rect x="0" y="175" width="88" height="9" rx="4.5" fill="url(#accentDark)"/>

      <text x="0" y="217" font-size="12.5" fill="#F3F5F9">Windows Terminal</text>
      <text x="312" y="217" font-size="12" fill="#B8C2FF" text-anchor="end">20分 · 7%</text>
      <rect x="0" y="226" width="312" height="9" rx="4.5" fill="#1B2130"/>
      <rect x="0" y="226" width="56" height="9" rx="4.5" fill="url(#accentDark)"/>
    </g>

    <text x="54" y="446" font-size="11.5" fill="#667085">支持按日 / 近 7 天对比、搜索与单应用详情</text>

    <!-- PANEL 2: Desktop Widget (Dark & Light Themes) -->
    <rect x="418" y="28" width="364" height="444" rx="20" fill="#131722" stroke="#202636"/>
    <text x="444" y="68" font-size="19" font-weight="600" fill="#F3F5F9">桌面小组件 · 深浅随系统</text>
    <text x="444" y="92" font-size="12.5" fill="#8E97AA">不占任务栏 · 自动跟随 Windows 主题</text>

    <!-- Back Card: Light Widget Preview -->
    <g transform="translate(556, 118)" filter="url(#cardShadow)">
      <rect width="202" height="224" rx="16" fill="#FFFFFF" stroke="#E0E5F0"/>
      <text x="16" y="27" font-size="11.5" font-weight="600" fill="#111827">屏幕时间</text>
      <text x="186" y="27" font-size="10" fill="#64748B" text-anchor="end">11月28日</text>
      <rect x="14" y="38" width="174" height="58" rx="11" fill="url(#heroLight)" stroke="#E6EAF2"/>
      <text x="24" y="55" font-size="9.5" fill="#64748B">今日活跃</text>
      <text x="24" y="81" font-size="20" font-weight="600" fill="#3F4CC7">4时36分</text>
      <rect x="134" y="54" width="44" height="24" rx="7" fill="#EEF0FE"/>
      <text x="156" y="70" font-size="11.5" font-weight="600" fill="#3F4CC7" text-anchor="middle">69%</text>
      <!-- Mini Capsule Bars -->
      <g fill="url(#barLightV)">
        <rect x="24" y="128" width="10" height="20" rx="3"/>
        <rect x="42" y="114" width="10" height="34" rx="3"/>
        <rect x="60" y="120" width="10" height="28" rx="3"/>
        <rect x="96" y="116" width="10" height="32" rx="3"/>
        <rect x="114" y="108" width="10" height="40" rx="3"/>
        <rect x="132" y="122" width="10" height="26" rx="3"/>
      </g>
      <text x="16" y="176" font-size="10.5" fill="#111827">VS Code</text>
      <text x="186" y="176" font-size="10.5" fill="#64748B" text-anchor="end">1时52分</text>
      <circle cx="20" cy="204" r="2.8" fill="#059669"/>
      <text x="28" y="207.5" font-size="9.5" fill="#64748B">正在记录</text>
    </g>

    <!-- Front Card: Obsidian Dark Widget Preview -->
    <g transform="translate(444, 178)" filter="url(#cardShadow)">
      <rect width="218" height="236" rx="18" fill="#111520" stroke="#2A3248"/>
      <text x="18" y="29" font-size="12.5" font-weight="600" fill="#F3F5F9">屏幕时间</text>
      <text x="200" y="29" font-size="10.5" fill="#8E97AA" text-anchor="end">11月28日</text>
      <rect x="16" y="42" width="186" height="62" rx="12" fill="url(#heroDark)" stroke="#202636"/>
      <text x="28" y="60" font-size="10" fill="#8E97AA">今日活跃</text>
      <text x="28" y="89" font-size="22" font-weight="600" fill="#B8C2FF">4时36分</text>
      <rect x="142" y="60" width="48" height="26" rx="8" fill="#1D2340"/>
      <text x="166" y="77" font-size="12.5" font-weight="600" fill="#B8C2FF" text-anchor="middle">69%</text>
      <!-- Mini Capsule Bars -->
      <g fill="url(#barDarkV)">
        <rect x="26" y="138" width="11" height="20" rx="3.5"/>
        <rect x="46" y="122" width="11" height="36" rx="3.5"/>
        <rect x="66" y="128" width="11" height="30" rx="3.5"/>
        <rect x="106" y="124" width="11" height="34" rx="3.5"/>
        <rect x="126" y="116" width="11" height="42" rx="3.5"/>
        <rect x="146" y="132" width="11" height="26" rx="3.5"/>
        <rect x="166" y="140" width="11" height="18" rx="3.5"/>
      </g>
      <text x="18" y="186" font-size="11" fill="#F3F5F9">Visual Studio Code</text>
      <text x="200" y="186" font-size="11" fill="#8E97AA" text-anchor="end">1时52分</text>
      <circle cx="22" cy="215" r="3" fill="#34D399"/>
      <text x="31" y="218.5" font-size="10.5" fill="#8E97AA">正在记录</text>
      <text x="200" y="218.5" font-size="10.5" font-weight="500" fill="#7C8AFF" text-anchor="end">暂停</text>
    </g>

    <text x="444" y="446" font-size="11.5" fill="#667085">支持拖拽记忆位置、锁定、独立置顶与托盘唤回</text>

    <!-- PANEL 3: Local Privacy & Lightweight Background -->
    <rect x="808" y="28" width="364" height="444" rx="20" fill="#131722" stroke="#202636"/>
    <text x="834" y="68" font-size="19" font-weight="600" fill="#F3F5F9">本地隐私 · 轻量常驻</text>
    <text x="834" y="92" font-size="12.5" fill="#8E97AA">无需账号，成品运行零联网请求</text>

    <!-- Shield Graphic -->
    <rect x="834" y="116" width="312" height="106" rx="16" fill="url(#heroDark)" stroke="#202636"/>
    <path d="M990 132 L1022 144 V172 C1022 192 1008 206 990 214 C972 206 958 192 958 172 V144 Z" fill="url(#accentDark)" fill-opacity="0.22" stroke="url(#accentDark)" stroke-width="2.2"/>
    <path d="M978 173 L987 182 L1004 163" fill="none" stroke="#34D399" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Feature Checklist Cards -->
    <g transform="translate(834, 240)">
      <rect width="312" height="40" rx="10" fill="#191E2D"/>
      <circle cx="18" cy="20" r="3.5" fill="#34D399"/>
      <text x="32" y="24" font-size="12.5" fill="#F3F5F9">不读取窗口标题、网址、截图或按键</text>

      <rect y="50" width="312" height="40" rx="10" fill="#191E2D"/>
      <circle cx="18" cy="70" r="3.5" fill="#7C8AFF"/>
      <text x="32" y="74" font-size="12.5" fill="#F3F5F9">隐藏窗口后台记录，自动释放面板内存</text>

      <rect y="100" width="312" height="40" rx="10" fill="#191E2D"/>
      <circle cx="18" cy="120" r="3.5" fill="#46C6E8"/>
      <text x="32" y="124" font-size="12.5" fill="#F3F5F9">独立采集线程 + 本地 data/ 原子落盘</text>

      <rect y="150" width="312" height="40" rx="10" fill="#191E2D"/>
      <circle cx="18" cy="170" r="3.5" fill="#FBBF24"/>
      <text x="32" y="174" font-size="12.5" fill="#F3F5F9">支持按日 / 近 7 天 CSV 导出与一键清理</text>
    </g>

    <text x="834" y="446" font-size="11.5" fill="#667085">MIT 开源 · 零第三方 NuGet 依赖</text>
  </g>
</svg>
